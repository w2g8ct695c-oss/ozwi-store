
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OZWİ Yönetici Paneli</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: #f5f5fa;
      color: #222; font-family: Arial, sans-serif;
    }
    main {
      max-width: 700px; margin: 20px auto; padding: 22px;
      background: white; border-radius: 16px;
      box-shadow: 0 4px 20px #00000010;
    }
    h1 { color: #6d28d9; }
    input, textarea, button {
      width: 100%; padding: 12px; margin: 7px 0;
      border: 1px solid #ddd; border-radius: 9px;
      font-size: 16px;
    }
    button {
      border: 0; background: #6d28d9; color: white;
      font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #444; }
    button.delete { background: #b91c1c; width: auto; }
    .product {
      border: 1px solid #eee; border-radius: 10px;
      padding: 12px; margin: 10px 0;
      overflow-wrap: anywhere;
    }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    .muted { color: #666; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>OZWİ Yönetici Paneli</h1>
  <p class="muted">Ürün yönetimi</p>

  <section id="login">
    <h2>Yönetici girişi</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="E-posta adresin"
        autocomplete="username" required>
      <input id="password" type="password" placeholder="Şifren"
        autocomplete="current-password" required>
      <button type="submit">Giriş yap</button>
    </form>
  </section>

  <section id="panel" hidden>
    <h2>Yeni ürün ekle</h2>
    <form id="productForm">
      <input id="name" placeholder="Ürün adı" required>
      <textarea id="description" placeholder="Ürün açıklaması"></textarea>
      <input id="price" type="number" min="0" step="0.01"
        placeholder="Fiyat (TL)" required>
      <input id="category" placeholder="Kategori" value="Diğer">
      <input id="image_url" type="url" placeholder="Ürün görseli bağlantısı">
      <input id="stock" type="number" min="0" step="1"
        placeholder="Stok adedi" value="0" required>
      <button type="submit">Ürünü kaydet</button>
    </form>
    <button id="refresh" class="secondary" type="button">Ürünleri yenile</button>
    <button id="logout" class="secondary" type="button">Çıkış yap</button>
    <h2>Ürünler</h2>
    <div id="products"></div>
  </section>

  <p id="status" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://kauvtuzglvulblrvoxbv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_XBjj3taxc4llK4FNY5y9Bw_MEzmta5y";

  const statusBox = document.getElementById("status");
  const loginSection = document.getElementById("login");
  const panel = document.getElementById("panel");
  const productsBox = document.getElementById("products");

  function status(message) {
    statusBox.textContent = message;
  }

  if (!window.supabase) {
    status("Bağlantı kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.");
    return;
  }

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function checkAdmin() {
    const { data: { user }, error: userError } = await db.auth.getUser();

    if (userError || !user) {
      loginSection.hidden = false;
      panel.hidden = true;
      return false;
    }

    const { data, error } = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) {
      status("Yönetici kontrolü başarısız: " + error.message);
      return false;
    }

    if (!data) {
      status("Bu hesap yönetici listesinde bulunamadı.");
      return false;
    }

    loginSection.hidden = true;
    panel.hidden = false;
    status("Giriş başarılı.");
    return true;
  }

  document.getElementById("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    status("Giriş deneniyor...");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      status("Giriş başarısız: " + error.message);
      return;
    }

    const ok = await checkAdmin();
    if (ok) await loadProducts();
  });

  async function loadProducts() {
    status("Ürünler yükleniyor...");

    const { data, error } = await db
      .from("products")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      status("Ürünler yüklenemedi: " + error.message);
      return;
    }

    productsBox.replaceChildren();

    if (!data || data.length === 0) {
      productsBox.textContent = "Henüz ürün eklenmemiş.";
    } else {
      data.forEach(product => {
        const item = document.createElement("div");
        item.className = "product";

        const title = document.createElement("strong");
        title.textContent = product.name;

        const details = document.createElement("p");
        details.textContent =
          Number(product.price).toLocaleString("tr-TR") + " TL · Stok: " +
          product.stock + " · " + (product.active ? "Aktif" : "Pasif");

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.textContent = "Ürünü sil";
        remove.addEventListener("click", async () => {
          if (!confirm('"' + product.name + '" ürününü silmek istiyor musun?')) return;

          const { error: deleteError } = await db
            .from("products").delete().eq("id", product.id);

          if (deleteError) {
            status("Silinemedi: " + deleteError.message);
            return;
          }

          status("Ürün silindi.");
          await loadProducts();
        });

        item.append(title, details, remove);
        productsBox.appendChild(item);
      });
    }

    status("Ürün listesi güncellendi.");
  }

  document.getElementById("productForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const product = {
      name: document.getElementById("name").value.trim(),
      description: document.getElementById("description").value.trim(),
      price: Number(document.getElementById("price").value),
      category: document.getElementById("category").value.trim() || "Diğer",
      image_url: document.getElementById("image_url").value.trim(),
      stock: Number(document.getElementById("stock").value),
      active: true
    };

    if (!product.name || !Number.isFinite(product.price) ||
        product.price < 0 || !Number.isInteger(product.stock) ||
        product.stock < 0) {
      status("Ürün adı, fiyat ve stok bilgilerini kontrol et.");
      return;
    }

    status("Ürün kaydediliyor...");

    const { error } = await db.from("products").insert(product);

    if (error) {
      status("Ürün kaydedilemedi: " + error.message);
      return;
    }

    document.getElementById("productForm").reset();
    document.getElementById("category").value = "Diğer";
    document.getElementById("stock").value = "0";

    status("Ürün başarıyla kaydedildi.");
    await loadProducts();
  });

  document.getElementById("refresh").addEventListener("click", loadProducts);

  document.getElementById("logout").addEventListener("click", async () => {
    await db.auth.signOut();
    loginSection.hidden = false;
    panel.hidden = true;
    status("Çıkış yapıldı.");
  });

  checkAdmin().then(ok => {
    if (ok) loadProducts();
  });
})();
</script>
</body>
</html>
