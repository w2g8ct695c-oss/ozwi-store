
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OZWİ Yönetici Paneli</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px;
      font-family: Arial, sans-serif;
      background: #f5f5fa; color: #222;
    }
    main {
      max-width: 700px; margin: 20px auto;
      padding: 22px; background: white;
      border-radius: 16px; box-shadow: 0 4px 20px #0001;
    }
    h1 { color: #6d28d9; }
    input, textarea, button {
      width: 100%; padding: 12px; margin: 7px 0;
      border: 1px solid #ddd; border-radius: 9px;
      font-size: 16px;
    }
    button {
      border: 0; background: #6d28d9;
      color: white; font-weight: bold; cursor: pointer;
    }
    .secondary { background: #444; }
    .delete { background: #b91c1c; }
    .product {
      padding: 12px; margin: 10px 0;
      border: 1px solid #eee; border-radius: 10px;
      overflow-wrap: anywhere;
    }
    #status, #resetStatus {
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .muted { color: #666; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>OZWİ Yönetici Paneli</h1>
  <p class="muted">Mağaza yönetimi</p>

  <section id="loginSection">
    <h2>Yönetici girişi</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="E-posta adresin"
        autocomplete="username" required>
      <input id="password" type="password" placeholder="Şifren"
        autocomplete="current-password" required>
      <button type="submit">Giriş yap</button>
    </form>
    <button id="forgotButton" class="secondary" type="button">
      Şifremi sıfırla
    </button>
  </section>

  <section id="resetRequestSection" hidden>
    <h2>Şifre sıfırlama</h2>
    <p>E-posta adresini gir. Kurtarma bağlantısı gönderilecek.</p>
    <form id="resetRequestForm">
      <input id="recoveryEmail" type="email"
        placeholder="Hesabındaki e-posta adresi" required>
      <button type="submit">Kurtarma bağlantısı gönder</button>
    </form>
    <button class="secondary backButton" type="button">Geri dön</button>
  </section>

  <section id="newPasswordSection" hidden>
    <h2>Yeni şifre belirle</h2>
    <p>Kurtarma bağlantısından buraya geldiysen yeni şifreni belirle.</p>
    <form id="newPasswordForm">
      <input id="newPassword" type="password" minlength="8"
        autocomplete="new-password"
        placeholder="Yeni şifre (en az 8 karakter)" required>
      <input id="confirmPassword" type="password" minlength="8"
        autocomplete="new-password"
        placeholder="Yeni şifreyi tekrar yaz" required>
      <button type="submit">Yeni şifreyi kaydet</button>
    </form>
  </section>

  <section id="panelSection" hidden>
    <h2>Yeni ürün ekle</h2>
    <form id="productForm">
      <input id="productName" placeholder="Ürün adı" required>
      <textarea id="description" placeholder="Ürün açıklaması"></textarea>
      <input id="price" type="number" min="0" step="0.01"
        placeholder="Fiyat (TL)" required>
      <input id="category" placeholder="Kategori" value="Diğer">
      <input id="imageUrl" type="url"
        placeholder="Ürün görseli bağlantısı">
      <input id="stock" type="number" min="0" step="1"
        placeholder="Stok adedi" value="0" required>
      <button type="submit">Ürünü kaydet</button>
    </form>
    <button id="refreshButton" class="secondary" type="button">
      Ürünleri yenile
    </button>
    <button id="logoutButton" class="secondary" type="button">
      Çıkış yap
    </button>
    <h2>Ürünler</h2>
    <div id="products"></div>
  </section>

  <p id="status" role="status"></p>
  <p id="resetStatus" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const URL = "https://kauvtuzglvulblrvoxbv.supabase.co";
  const KEY = "sb_publishable_XBjj3taxc4llK4FNY5y9Bw_MEzmta5y";

  const $ = id => document.getElementById(id);
  const status = message => $("status").textContent = message;
  const resetStatus = message => $("resetStatus").textContent = message;

  if (!window.supabase) {
    status("Bağlantı kütüphanesi yüklenemedi. İnterneti kontrol et.");
    return;
  }

  const db = window.supabase.createClient(URL, KEY, {
    auth: {
      flowType: "implicit",
      detectSessionInUrl: true,
      persistSession: true,
      autoRefreshToken: true
    }
  });

  const sections = [
    "loginSection", "resetRequestSection",
    "newPasswordSection", "panelSection"
  ];

  function showSection(id) {
    sections.forEach(section => $(section).hidden = section !== id);
  }

  function hasRecoveryMarker() {
    const hash = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    return hash.get("type") === "recovery" ||
           query.get("type") === "recovery";
  }

  async function checkAdmin() {
    const { data: { user }, error: userError } = await db.auth.getUser();

    if (userError || !user) {
      showSection("loginSection");
      return false;
    }

    const { data, error } = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) {
      showSection("loginSection");
      status("Yönetici kontrolü başarısız: " + error.message);
      return false;
    }

    if (!data) {
      showSection("loginSection");
      status("Bu kullanıcı yönetici listesinde bulunamadı.");
      return false;
    }

    showSection("panelSection");
    status("Giriş başarılı.");
    return true;
  }

  async function loadProducts() {
    status("Ürünler yükleniyor...");

    const { data, error } = await db
      .from("products")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      status("Ürünler yüklenemedi: " + error.message);
      return;
    }

    $("products").replaceChildren();

    if (!data || data.length === 0) {
      $("products").textContent = "Henüz ürün eklenmemiş.";
    } else {
      data.forEach(product => {
        const box = document.createElement("div");
        box.className = "product";

        const name = document.createElement("strong");
        name.textContent = product.name;

        const details = document.createElement("p");
        details.textContent =
          Number(product.price).toLocaleString("tr-TR") +
          " TL · Stok: " + product.stock +
          " · " + (product.active ? "Aktif" : "Pasif");

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.textContent = "Ürünü sil";

        remove.addEventListener("click", async () => {
          if (!confirm('"' + product.name + '" silinsin mi?')) return;

          const { error: deleteError } = await db
            .from("products").delete().eq("id", product.id);

          if (deleteError) {
            status("Silinemedi: " + deleteError.message);
            return;
          }

          status("Ürün silindi.");
          await loadProducts();
        });

        box.append(name, details, remove);
        $("products").appendChild(box);
      });
    }

    status("Ürün listesi güncellendi.");
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    status("Giriş deneniyor...");

    const email = $("email").value.trim();
    const password = $("password").value;

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      status("Giriş başarısız: " + error.message);
      return;
    }

    if (await checkAdmin()) await loadProducts();
  });

  $("forgotButton").addEventListener("click", () => {
    $("recoveryEmail").value = $("email").value.trim();
    resetStatus("");
    showSection("resetRequestSection");
  });

  $("resetRequestForm").addEventListener("submit", async event => {
    event.preventDefault();
    resetStatus("Kurtarma e-postası isteniyor...");

    const email = $("recoveryEmail").value.trim();

    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: URL.replace(/\/$/, "") === URL
        ? "https://ozwi-store.onrender.com/admin.html"
        : "https://ozwi-store.onrender.com/admin.html"
    });

    if (error) {
      resetStatus("E-posta gönderilemedi: " + error.message);
      return;
    }

    resetStatus("İstek gönderildi. Gelen kutunu ve spam klasörünü kontrol et.");
  });

  $("newPasswordForm").addEventListener("submit", async event => {
    event.preventDefault();

    const password = $("newPassword").value;
    const confirmation = $("confirmPassword").value;

    if (password.length < 8) {
      resetStatus("Şifre en az 8 karakter olmalı.");
      return;
    }

    if (password !== confirmation) {
      resetStatus("İki şifre aynı değil. Tekrar kontrol et.");
      return;
    }

    resetStatus("Şifre güncelleniyor...");

    const { error } = await db.auth.updateUser({ password });

    if (error) {
      resetStatus("Şifre değiştirilemedi: " + error.message);
      return;
    }

    resetStatus("Şifren güncellendi. Yönetici girişi ekranına dönüp yeni şifrenle giriş yapabilirsin.");
    showSection("loginSection");
  });

  $("productForm").addEventListener("submit", async event => {
    event.preventDefault();

    const product = {
      name: $("productName").value.trim(),
      description: $("description").value.trim(),
      price: Number($("price").value),
      category: $("category").value.trim() || "Diğer",
      image_url: $("imageUrl").value.trim(),
      stock: Number($("stock").value),
      active: true
    };

    if (!product.name || !Number.isFinite(product.price) ||
        product.price < 0 || !Number.isInteger(product.stock) ||
        product.stock < 0) {
      status("Ürün adı, fiyat ve stok bilgilerini kontrol et.");
      return;
    }

    status("Ürün kaydediliyor...");

    const { error } = await db.from("products").insert(product);

    if (error) {
      status("Ürün kaydedilemedi: " + error.message);
      return;
    }

    $("productForm").reset();
    $("category").value = "Diğer";
    $("stock").value = "0";
    status("Ürün kaydedildi.");
    await loadProducts();
  });

  $("refreshButton").addEventListener("click", loadProducts);

  $("logoutButton").addEventListener("click", async () => {
    await db.auth.signOut();
    showSection("loginSection");
    status("Çıkış yapıldı.");
  });

  document.querySelectorAll(".backButton").forEach(button => {
    button.addEventListener("click", () => {
      resetStatus("");
      showSection("loginSection");
    });
  });

  db.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY" || hasRecoveryMarker()) {
      showSection("newPasswordSection");
      resetStatus("Yeni şifreni belirle.");
    }
  });

  async function start() {
    if (hasRecoveryMarker()) {
      showSection("newPasswordSection");
      resetStatus("Yeni şifreni belirle.");
      return;
    }

    if (await checkAdmin()) await loadProducts();
  }

  start();
})();
</script>
</body>
</html>
